<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestor de Cómodos Partilhado</title>
    <!-- Importar o cliente do Supabase via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            -webkit-tap-highlight-color: transparent;
        }

        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: var(--primary-color); margin-bottom: 15px; font-size: 1.5rem; }

        /* Ecrã de Bloqueio por Palavra-passe */
        #authScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999999;
        }
        .auth-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .auth-box h2 { margin-bottom: 15px; font-size: 1.2rem; color: var(--text-color); }
        .auth-box input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
        }
        .auth-box button {
            width: 100%;
            padding: 10px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .auth-error { color: var(--danger-color); font-size: 12px; margin-top: 8px; display: none; }

        /* Restante Estilização da Aplicação */
        .tabs-container-wrapper {
            display: flex; overflow-x: auto; gap: 12px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px; margin-bottom: 15px; align-items: center;
        }
        .tabs-group { display: flex; gap: 8px; align-items: center; }
        .tabs-separator { width: 2px; height: 28px; background-color: var(--border-color); margin: 0 4px; flex-shrink: 0; }
        .tabs-group-label { font-size: 11px; font-weight: bold; color: #64748b; text-transform: uppercase; margin-right: 4px; white-space: nowrap; }
        
        .tab-btn-wrapper {
            display: flex; align-items: center; background-color: #e2e8f0;
            border-radius: 6px 6px 0 0; white-space: nowrap; overflow: hidden; cursor: pointer;
        }
        .tab-btn-wrapper.active { background-color: var(--primary-color); }
        .tab-btn { background: transparent; border: none; padding: 8px 12px 8px 14px; cursor: pointer; font-size: 14px; font-weight: 600; color: #475569; }
        .tab-btn-wrapper.active .tab-btn { color: white; }
        .tab-edit-btn { background: transparent; border: none; padding: 8px 10px 8px 0; cursor: pointer; font-size: 13px; color: #64748b; }
        .tab-btn-wrapper.active .tab-edit-btn { color: #cbd5e1; }

        .action-buttons-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .action-btn {
            background-color: var(--success-color); color: white; border: none;
            padding: 12px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; flex: 1; min-width: 140px; text-align: center;
        }
        .delete-tab-btn { background-color: var(--danger-color); }
        .add-box-btn { background-color: var(--primary-color); color: white; border: none; padding: 12px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; margin-bottom: 15px; width: 100%; }

        .boxes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
        .box-container {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px;
        }
        .box-header { display: flex; justify-content: space-between; align-items: center; }
        .box-label { font-size: 12px; font-weight: bold; color: #475569; text-transform: capitalize; }
        .char-counter { font-size: 11px; color: #94a3b8; }
        .input-row { display: flex; gap: 6px; align-items: center; }
        .main-input { flex: 1; height: 38px; border: 1px solid var(--border-color); border-radius: 4px; padding: 0 10px; font-size: 14px; outline: none; }
        .main-input:focus { border-color: var(--primary-color); }
        .info-btn { background-color: #f1f5f9; border: 1px solid var(--border-color); width: 38px; height: 38px; border-radius: 4px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        .info-btn.active { background-color: #e0e7ff; border-color: var(--primary-color); }
        .infinite-container { display: none; margin-top: 6px; }
        .infinite-container.show { display: block; }
        .infinite-textarea { width: 100%; height: 90px; resize: vertical; border: 1px dashed var(--primary-color); border-radius: 4px; padding: 8px; font-family: inherit; font-size: 13px; background-color: #faf8ff; outline: none; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 9999; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 320px; text-align: center; }
        .modal-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .modal-btn { padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; }
        .modal-btn.fixed { background-color: var(--primary-color); }
        .modal-btn.infinite { background-color: var(--success-color); }
        .modal-btn.cancel { background-color: #e2e8f0; color: #475569; }
    </style>
</head>
<body>

    <!-- Ecrã de Palavra-Passe -->
    <div id="authScreen">
        <div class="auth-box">
            <h2>Insira a Palavra-Passe</h2>
            <input type="password" id="passInput" placeholder="Palavra-passe do site">
            <button id="authBtn">Entrar</button>
            <div class="auth-error" id="authError">Palavra-passe incorreta!</div>
        </div>
    </div>

    <div class="container" style="display:none;" id="mainApp">
        <h1>Gestor de Cómodos (Supabase)</h1>

        <div class="action-buttons-bar">
            <button class="action-btn" id="btnNovoComodo">+ Novo Cómodo</button>
            <button class="action-btn delete-tab-btn" id="btnExcluirComodo">Excluir Cómodo Atual</button>
        </div>

        <div class="tabs-container-wrapper" id="tabsHeader"></div>
        <div id="extraControls"></div>
        <div id="tabContent"></div>
    </div>

    <!-- Modal Novo Cómodo -->
    <div class="modal-overlay" id="newTabModal">
        <div class="modal-content">
            <h3>Como deseja o novo cómodo?</h3>
            <div class="modal-buttons">
                <button class="modal-btn fixed" id="modalBtnFixed">Com 17 Despedidas</button>
                <button class="modal-btn infinite" id="modalBtnInfinite">Infinito (Começar com 1)</button>
                <button class="modal-btn cancel" id="modalBtnCancel">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURAÇÃO DO SUPABASE ---
        const SUPABASE_URL = 'SUA_URL_DO_SUPABASE'; // Ex: 'https://xyz.supabase.co'
        const SUPABASE_ANON_KEY = 'SUA_CHAVE_ANON_SUPABASE'; // Ex: 'eyJhbGci...'
        
        // Palavra-passe definida por ti para proteger o site
        const SITE_PASSWORD = 'a_tua_palavra_passe_aqui'; 

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let data = [];
        let currentTabId = null;
        let saveTimeout = null;

        // --- SISTEMA DE SENHA ---
        document.getElementById('authBtn').onclick = checkPassword;
        document.getElementById('passInput').onkeydown = (e) => { if (e.key === 'Enter') checkPassword(); };

        if (sessionStorage.getItem('seventimes_auth') === 'true') {
            unlockApp();
        }

        function checkPassword() {
            const val = document.getElementById('passInput').value;
            if (val === SITE_PASSWORD) {
                sessionStorage.setItem('seventimes_auth', 'true');
                unlockApp();
            } else {
                document.getElementById('authError').style.display = 'block';
            }
        }

        function unlockApp() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            initApp();
        }

        // --- 2. LÓGICA DA APLICAÇÃO E SUPABASE ---
        async function initApp() {
            await loadDataFromSupabase();
            setupEventListeners();
            render();
        }

        async function loadDataFromSupabase() {
            const { data: rows, error } = await supabaseClient
                .from('seventimes_data')
                .select('*')
                .eq('id', 1)
                .single();

            if (error || !rows) {
                // Dados padrão se a tabela estiver vazia
                data = [{
                    id: 'comodo_1',
                    title: 'Cómodo 1',
                    type: 'fixed', 
                    boxes: Array(17).fill('').map(() => ({ shortText: '', infiniteText: '', showInfinite: false }))
                }];
                currentTabId = data[0].id;
                await saveDataToSupabase();
            } else {
                data = rows.content;
                currentTabId = data[0]?.id || null;
            }
        }

        function saveDataToSupabaseDebounced() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                await saveDataToSupabase();
            }, 1000); // Grava 1 segundo após parar de escrever para poupar pedidos
        }

        async function saveDataToSupabase() {
            await supabaseClient
                .from('seventimes_data')
                .upsert({ id: 1, content: data });
        }

        function setupEventListeners() {
            document.getElementById('btnNovoComodo').onclick = () => document.getElementById('newTabModal').classList.add('active');
            document.getElementById('modalBtnCancel').onclick = () => document.getElementById('newTabModal').classList.remove('active');
            document.getElementById('modalBtnFixed').onclick = () => createNewTab('fixed');
            document.getElementById('modalBtnInfinite').onclick = () => createNewTab('infinite');
            document.getElementById('btnExcluirComodo').onclick = deleteCurrentTab;
        }

        function createNewTab(type) {
            document.getElementById('newTabModal').classList.remove('active');
            const initialBoxesCount = type === 'fixed' ? 17 : 1;
            const newId = 'comodo_' + Date.now();
            const newTitle = `Cómodo ${data.length + 1}`;
            
            data.push({
                id: newId,
                title: newTitle,
                type: type,
                boxes: Array(initialBoxesCount).fill('').map(() => ({ shortText: '', infiniteText: '', showInfinite: false }))
            });
            
            currentTabId = newId;
            render();
            saveDataToSupabase();
        }

        function render() {
            const tabsHeader = document.getElementById('tabsHeader');
            const tabContent = document.getElementById('tabContent');
            const extraControls = document.getElementById('extraControls');

            if (!tabsHeader || !tabContent) return;
            tabsHeader.innerHTML = '';

            const fixedTabs = data.filter(t => t.type === 'fixed');
            const infiniteTabs = data.filter(t => t.type === 'infinite');

            const renderTabGroup = (items, groupLabel) => {
                if (items.length === 0) return;
                const groupDiv = document.createElement('div');
                groupDiv.className = 'tabs-group';

                const label = document.createElement('span');
                label.className = 'tabs-group-label';
                label.innerText = groupLabel;
                groupDiv.appendChild(label);

                items.forEach((tab) => {
                    const isActive = tab.id === currentTabId;
                    const wrapper = document.createElement('div');
                    wrapper.className = `tab-btn-wrapper ${isActive ? 'active' : ''}`;

                    const btn = document.createElement('button');
                    btn.className = 'tab-btn';
                    btn.innerText = tab.title;
                    btn.onclick = () => { currentTabId = tab.id; render(); };

                    const editBtn = document.createElement('button');
                    editBtn.className = 'tab-edit-btn';
                    editBtn.innerHTML = '✏️';
                    editBtn.onclick = (e) => {
                        e.stopPropagation();
                        enableTabRename(tab.id, wrapper);
                    };

                    wrapper.appendChild(btn);
                    wrapper.appendChild(editBtn);
                    groupDiv.appendChild(wrapper);
                });
                tabsHeader.appendChild(groupDiv);
            };

            renderTabGroup(fixedTabs, 'Fixo');
            if (fixedTabs.length > 0 && infiniteTabs.length > 0) {
                const sep = document.createElement('div');
                sep.className = 'tabs-separator';
                tabsHeader.appendChild(sep);
            }
            renderTabGroup(infiniteTabs, 'Infinito');

            const currentTab = data.find(t => t.id === currentTabId) || data[0];
            if (!currentTab) return;

            if (currentTab.type === 'infinite') {
                extraControls.innerHTML = `<button class="add-box-btn" id="btnAddInfiniteBox">+ Adicionar Nova Despedida</button>`;
                setTimeout(() => {
                    const btn = document.getElementById('btnAddInfiniteBox');
                    if (btn) btn.onclick = () => {
                        currentTab.boxes.push({ shortText: '', infiniteText: '', showInfinite: false });
                        render();
                        saveDataToSupabase();
                    };
                }, 0);
            } else {
                extraControls.innerHTML = '';
            }

            let gridHtml = `<div class="boxes-grid">`;
            currentTab.boxes.forEach((boxData, i) => {
                gridHtml += `
                    <div class="box-container">
                        <div class="box-header">
                            <span class="box-label">despedida ${i + 1}</span>
                            <span class="char-counter" id="counter_${i}">${(boxData.shortText || '').length}/20</span>
                        </div>
                        <div class="input-row">
                            <input type="text" class="main-input" maxlength="20" 
                                value="${escapeHtml(boxData.shortText)}" 
                                placeholder="Máx 20 caracteres..." 
                                oninput="updateShortText(${i}, this.value)" />
                            <button class="info-btn ${boxData.showInfinite ? 'active' : ''}" 
                                onclick="toggleInfinite(${i})">ℹ</button>
                        </div>
                        <div class="infinite-container ${boxData.showInfinite ? 'show' : ''}">
                            <textarea class="infinite-textarea" 
                                placeholder="Escreva o quanto quiser aqui..." 
                                oninput="updateInfiniteText(${i}, this.value)">${escapeHtml(boxData.infiniteText)}</textarea>
                        </div>
                    </div>
                `;
            });
            gridHtml += `</div>`;
            tabContent.innerHTML = gridHtml;
        }

        function updateShortText(index, value) {
            const currentTab = data.find(t => t.id === currentTabId);
            if (currentTab) {
                currentTab.boxes[index].shortText = value;
                const counter = document.getElementById(`counter_${index}`);
                if (counter) counter.innerText = `${value.length}/20`;
                saveDataToSupabaseDebounced();
            }
        }

        function updateInfiniteText(index, value) {
            const currentTab = data.find(t => t.id === currentTabId);
            if (currentTab) {
                currentTab.boxes[index].infiniteText = value;
                saveDataToSupabaseDebounced();
            }
        }

        function toggleInfinite(index) {
            const currentTab = data.find(t => t.id === currentTabId);
            if (currentTab) {
                currentTab.boxes[index].showInfinite = !currentTab.boxes[index].showInfinite;
                render();
                saveDataToSupabase();
            }
        }

        function deleteCurrentTab() {
            if (data.length === 1) {
                alert("Não pode excluir o único cómodo restante!");
                return;
            }
            if (confirm("Tem certeza que deseja excluir este cómodo?")) {
                data = data.filter(t => t.id !== currentTabId);
                currentTabId = data[0].id;
                render();
                saveDataToSupabase();
            }
        }

        function enableTabRename(tabId, wrapperElement) {
            const tab = data.find(t => t.id === tabId);
            if (!tab) return;
            currentTabId = tabId;
            wrapperElement.innerHTML = '';

            const input = document.createElement('inputtype');
            input.type = 'text';
            input.style.cssText = 'border:1px solid #4f46e5; background:white; font-size:14px; font-weight:600; width:110px; padding:4px; border-radius:4px; outline:none; margin:4px;';
            input.value = tab.title;
            wrapperElement.appendChild(input);
            input.focus();
            input.select();

            const save = () => {
                if (input.value.trim()) tab.title = input.value.trim();
                render();
                saveDataToSupabase();
            };
            input.onblur = save;
            input.onkeydown = (e) => { if (e.key === 'Enter') save(); };
        }

        function escapeHtml(text) {
            return (text || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
